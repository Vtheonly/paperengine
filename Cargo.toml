[package]
name = "paperengine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Local-first research acquisition engine with a pure in-memory policy kernel"
license = "MIT"

[lib]
name = "paperengine"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
blake3 = "1.5"
futures-util = "0.3"
lopdf = { version = "=0.36.0", default-features = false }
quick-xml = "0.37"
reqwest = { version = "0.11", default-features = false, features = ["stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }
thiserror = "1.0"
tokio = { version = "1.36", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
